services:
  pricelab:
    build: .
    ports:
      - "8501:8501"
    environment:
      # Override any of these to point at a real deployment's values;
      # PRICELAB_DATABASE_URL here already matches the Dockerfile's VOLUME,
      # so the default works with no configuration at all.
      PRICELAB_ENVIRONMENT: production
      PRICELAB_DATABASE_URL: sqlite:////data/pricelab.db
    volumes:
      # Named volume, not a bind mount: the audit log, the run registry and
      # user accounts live in this SQLite file, and it must survive
      # `docker compose down` the same way a real deployment's database
      # would, rather than resetting on every rebuild.
      - pricelab-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pricelab-data:
