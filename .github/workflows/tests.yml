name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      # Exactly the versions in the committed lock, never a fresh
      # resolution: a new upstream release cannot change this job's result.
      # The lock-refresh workflow is where upstream is tried on purpose.
      - name: Install the locked dependencies
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy, strict over core/ and engine/)
        run: mypy

      - name: Tests (SQLite)
        run: pytest -v

  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pricelab
          POSTGRES_PASSWORD: pricelab
          POSTGRES_DB: pricelab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pricelab -d pricelab_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock
      - name: Install the locked dependencies
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Tests (PostgreSQL)
        env:
          PRICELAB_TEST_DATABASE_URL: postgresql+psycopg://pricelab:pricelab@localhost:5432/pricelab_test
        run: pytest -v
