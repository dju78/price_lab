[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Overridden at runtime in migrations/env.py from PRICELAB_DATABASE_URL
# (via pricelab.core.config.Settings); the value here is only the
# fallback used if that import somehow fails.
sqlalchemy.url = sqlite:///./pricelab.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
